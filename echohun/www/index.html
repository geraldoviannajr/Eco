<html lang="pt-BR">
    <head>
        <title>Echo Hunters</title>
        <style>
            @font-face {
                font-family: 'Press Start 2P';
                src: url('./assets/PressStart2P-Regular.ttf') format('truetype');
            }

            @font-face {
                font-family: 'Horrorfind-gp0Y';
                src: url('./assets/Horrorfind-gp0Y.ttf') format('truetype');
            }

            body { 
                margin: 0; 
                background: #000; 
                overflow: hidden;
                width: 100vw;
                height: 100vh;
                position: absolute;
                display: block;
                top: 0;
                left: 0;
            }
            
            canvas { 
                display: none; 
                position: absolute;
                top: 0; 
                left: 0; 
                width: 100%; 
                height: 100%;
                background-color: #000;
            }            

            .overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                display: none;
                place-content: center;
                place-items: center;
            }

            .overlay.red {
                background-color: rgba(255, 0, 0, 0.5);
            }

            .overlay.green {
                background-color: rgba(0, 255, 0, 0.5);
            }

            .overlay.blue {
                background-color: rgba(0, 0, 255, 0.5);
            }

            .overlay.active {
                display: block;
                z-index: 1000;
            }

            .horror {
                font-family: 'Horrorfind-gp0Y', monospace;;
            }

            .text {
                font-family: 'Horrorfind-gp0Y', monospace;;
                font-size: 2em;
                color: rgba(255, 255, 255, 0.8);;
                text-align: center;
                text-shadow: 0.1em 0.1em 4px rgba(0, 0, 0, 1)
            }          
            
            #tela-inicial {
                opacity: 1;
                transition: opacity 0.7s ease;
                pointer-events: all;
            }

            #tela-inicial.fade-out {
                opacity: 0;
                pointer-events: none;
            }      
                  
    </style>
        <script src="js/sounds/howler.js"></script>
        <script src="js/sounds/howler.spatial.min.js"></script>
        <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:

            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
    </head>
    <body>
        <script src="cordova.js"></script>
        <script src="js/config.js"></script>
        <script src="js/language/language.js"></script>
        <script src="js/sounds/sounds.js"></script>
        <script src="js/echoline.js"></script>
        <script src="js/objects/mapObject.js"></script>
        <script src="js/objects/enemies/enemy.js"></script>
        <script src="js/objects/enemies/darkness.js"></script>
        <script src="js/objects/enemies/deepdarkness.js"></script>
        <script src="js/objects/enemies/littledarkness.js"></script>
        <script src="js/objects/powerups/powerup.js"></script>
        <script src="js/objects/powerups/puhp.js"></script>        
        <script src="js/colision.js"></script>
        <script src="js/pathfinder.js"></script>
        <script src="js/elements/bag.js"></script>
        <script src="js/elements/control.js"></script>
        <script src="js/elements/camera.js"></script>
        <script src="js/elements/hud.js"></script>
        <script src="js/elements/radar.js"></script>        
        <script src="js/objects/player.js"></script>
        <script src="js/maps/map.js"></script>
        <script src="js/maps/map1.js"></script>    
        <script src="js/game.js"></script>        

        <canvas id="gameCanvas" style="display: none;"></canvas>
        <!--<div id="gameover_screen" class="overlay overlay red"><div class="text">** VOCÊ MORREU **</div></div>-->

        <div id="tela-inicial" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #111;">
            <!--<img src="img/logo.png" alt="Logo do Jogo" style="width: 50px; margin-bottom: 10px;">-->
            <h1 class="horror" style="font-size: 7rem; color: #fff; margin-bottom: 10px;">ECHO HUNTERS</h1>
            <p style="font-size: 2rem; font-family: 'PressStart2P-Regular', monospace; color: #aaa; margin-bottom: 5px;">Sinta a escuridão, fuja dos ecos</p>
            <button id="btn-iniciar" style="padding: 20px 60px; font-size: 1.5em; border: none; border-radius: 8px; background: #ff0055; color: #fff; cursor: pointer; font-family: 'PressStart2P-Regular', monospace; box-shadow: 0 4px 16px #0008;">Iniciar</button>
            <div style="position: absolute; bottom: 16px; color: #444; font-size: 0.9em;">&copy; 2025 geraldoviannajr@gmail.com</div>
        </div>

        <script src="js/index.js"></script>
    </body>
</html>
